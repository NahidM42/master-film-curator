name: Bootstrap synthetic sample

on:
  push:
    branches:
      - public-release-prep-2026-10-02
    paths:
      - scripts/generate_sample_catalog.py
      - .github/workflows/bootstrap-sample.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known

      - name: Install project dependencies
        run: uv sync --locked

      - name: Generate public-safe sample workbook
        run: uv run python scripts/generate_sample_catalog.py

      - name: Commit generated workbook
        shell: bash
        run: |
          git add sample-data/Rev07_Sample_Catalog_60.xlsx
          if git diff --cached --quiet; then
            echo "Synthetic workbook is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add generated 60-record synthetic catalog"
          git push
