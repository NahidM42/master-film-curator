name: CI

on:
  push:
    branches:
      - main
      - public-release-prep-2026-10-02
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known
          python-version: "3.12"
          enable-cache: true

      - name: Install project
        run: uv sync --locked --extra tui

      - name: Verify tracked synthetic catalog
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from master_film_curator.catalog.excel_reader import read_catalog

          path = Path("sample-data/Rev07_Sample_Catalog_60.xlsx")
          records = read_catalog(path, expected_count=60)
          assert len(records) == 60
          assert len({record.master_id for record in records}) == 60
          print("synthetic catalog records:", len(records))
          PY

      - name: Verify sample generator independently
        run: |
          uv run python scripts/generate_sample_catalog.py --output /tmp/Rev07_Sample_Catalog_60.xlsx
          uv run python scripts/inspect_excel.py /tmp/Rev07_Sample_Catalog_60.xlsx > /tmp/sample-inspection.json
          uv run python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/sample-inspection.json").read_text())
          assert data["sheets"]["Rev07_Channel_Value_Ranking"]["rows"] == 60
          assert not data["sheets"]["Rev07_Channel_Value_Ranking"]["duplicate_ids"]
          print("generated sample verified")
          PY

      - name: Run tests
        run: uv run pytest

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Build package
        run: uv build

      - name: Verify CLI
        run: uv run film-curator --help

      - name: Run generated-library integration
        run: |
          uv run python scripts/run_fake_library.py             --output ./demo-output-ci             --ffmpeg ffmpeg             --ffprobe ffprobe
