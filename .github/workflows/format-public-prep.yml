name: Format public-prep changes

on:
  push:
    branches:
      - public-release-prep-2026-10-02
    paths:
      - .github/workflows/format-public-prep.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known
          python-version: "3.12"
      - run: uv sync --locked
      - name: Apply Ruff formatting
        run: |
          uv run ruff format             scripts/generate_sample_catalog.py             scripts/inspect_excel.py             tests/test_end_to_end.py             tests/test_operations.py
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts tests
          git commit -m "Format public-release changes"
          git push
