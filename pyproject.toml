[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-library-curator"
version = "0.1.0"
description = "Safety-first, local Rev07 media catalog curator"
requires-python = ">=3.12"
dependencies = ["typer>=0.15", "rich>=13", "rapidfuzz>=3", "openpyxl>=3.1", "pydantic>=2", "PyYAML>=6"]

[project.optional-dependencies]
tui = ["textual>=1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
media-curator = "media_curator.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/media_curator"]
